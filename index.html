<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCR 240 - Lab 1: Alfi's Space Adventure</title>
    
    
   <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" crossorigin="anonymous"></script>
    
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* DESIGN PASS: Use new BG color */
            background-color: #0B1220; 
            color: #ffffff;
            /* DESIGN PASS: Use Inter font */
            font-family: "Inter", SF Pro Display, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        }
        #game-container {
            border-radius: 8px;
            /* A futuristic teal glow */
            box-shadow: 0 0 25px rgba(80, 227, 194, 0.6);
            overflow: hidden;
            border: 1px solid rgba(80, 227, 194, 0.3);
            /* This container will be *behind* the HTML overlay */
            position: relative;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        /* --- NEW HTML HERO OVERLAY STYLES --- */
        #hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0B1220;
            /* Subtle radial glow */
            background-image: radial-gradient(circle at 50% 30%, rgba(0, 255, 200, 0.1), rgba(0, 255, 200, 0) 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #FFFFFF;
            text-align: center;
            flex-direction: column;
        }
        .hero-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            padding: 20px;
        }
        .hero-stack h1 {
            color: #00FFC8; /* Teal */
            font-weight: 800;
            font-size: 48px; /* Large */
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }
        .hero-stack h2 {
            color: #FFFFFF;
            font-weight: 500; /* Medium */
            font-size: 28px;
            margin: 18px 0;
        }
        .hero-stack p {
            color: #E8E8E8; /* Soft White */
            font-weight: 400;
            font-size: 20px;
            line-height: 1.6;
            margin: 0;
        }
        .hero-buttons {
            margin-top: 32px;
            display: flex;
            gap: 16px;
        }
        .hero-btn {
            min-width: 260px;
            height: 60px;
            font-size: 20px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-primary {
            background-color: #3B82F6; /* Blue */
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background-color: #60a5fa;
        }
        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid #FFFFFF;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="hero-overlay">
        <div class="hero-stack">
            <h1>DR. MODALI LEARNING LABS</h1>
            <h2>HCR 240 - IMMUNOLOGY LAB 1</h2>
            <p>Alfi is Lost in Space</p>
            <div class="hero-buttons">
                <button class="hero-btn btn-primary" onclick="startMission()">BEGIN MISSION</button>
                <button class="hero-btn btn-secondary" onclick="showHelp()">How to Play</button>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

    
    
    <script>
        // --- Game Constants ---
        const SAFE_W = 1280;
        const SAFE_H = 720;
        
        // FIX: Create the layout helper function with full bounds
        function createLayout(scene){
           const W = scene.scale.width;
           const H = scene.scale.height;
           const P = Math.round(Math.min(W, H) * 0.04); // padding
           const wrap = Math.round(W * 0.68);
           return {
               W, H, P, wrap,
               midX: W / 2,
               midY: H / 2,
               left: P,
               right: W - P,
               top: P,
               bottom: H - P,
               panelW: Math.round(W * 0.82),
               panelH: Math.round(H * 0.62)
           };
        }
        
        // FIX: Add global error listener
        window.addEventListener('error', e => {
           console.error('[GLOBAL ERROR]', e.message, e.filename, e.lineno, e.colno, e.error);
        });
        // FIX: Add unhandled rejection listener
        window.addEventListener('unhandledrejection', e => {
           console.error('[GLOBAL UNHANDLED REJECTION]', e.reason);
        });

        // --- Colors (Not part of UI object, for in-game graphics) ---
        const C_COLOR_RED = 0xe74c3c;     // Warning / Inflammation
        const C_COLOR_BLUE = 0x3498db;    // Cells / Receptors
        const C_COLOR_PURPLE = 0x9b59b6;  // Cells
        const C_COLOR_YELLOW = 0xf1c40f;  // Signals / PAMPs
        const C_COLOR_GREEN = 0x2ecc71;   // Success
        const C_COLOR_LIGHT_GREY_GFX = 0xE0E0E0; // For neutrophil

        // --- Game State ---
        const GameState = {
            scene: 'Title', // Title, NameInput, Briefing, Gameplay, Summary
            studentName: "",
            worksheetData: [], // This will be our mission log
            game: null, // Phaser scene context
            clickBlock: false, // Prevent rapid clicks
            currentStage: 0,
            dragLine: null, // For drag-to-link game
            dragSource: null, // For drag-to-link game
            dragNodes: [], // Store draggable nodes
            linkCount: 0, // For drag-to-link game
            neutrophilStep: 0, // For the extravasation minigame
            burstStep: 0, // For the oxidative burst minigame
            stageComplete: false, // Bug fix for PLA2 click
        };

        // --- Logging ---
        function log(tag, msg) {
            console.log(`[ALFI:${tag}] ${msg}`);
        }

        // --- DESIGN SYSTEM (NEW) ---
        // FIX: Sanitized UI object (fontStyle and quotes)
        const UI = {
           FONT: 'Inter, system-ui, -apple-system, Segoe UI, Roboto',
           H1: { fontFamily:'Inter', fontSize:'48px', fontStyle:'bold', color:'#14B8A6' }, // TEAL
           H2: { fontFamily:'Inter', fontSize:'28px', fontStyle:'bold', color:'#FFFFFF' },
           BODY: (wrap)=>({ fontFamily:'Inter', fontSize:'20px', color:'#E5E7EB', wordWrap:{ width:wrap, useAdvancedWrap:true}, align:'center', lineSpacing:6 }),
           color: {
               bg:      '#0B1220',
               text:    '#FFFFFF',
               textSoft:'#E8E8E8',
               brand:   '#14B8A6',  // Updated Teal
               primary: '#3B82F6',
               outline: '#FFFFFF',
               banner:  '#9CE8DB'    // light teal tag background
           },
           type: {
               family: 'Inter, SF Pro Display, system-ui, -apple-system, sans-serif',
               h1:     36,
               h2:     28,
               body:   20,
               small:  18
           },
           button: { minW: 260, minH: 60, radius: 14, font: 20, stroke: 2 },
           card:   { padX: 24, padY: 18, radius: 14, stroke: 2, shadow: true }
        };

        // FIX: Add fontStyle sanitizer
        function sanitizeFontStyle(styleObj) {
            if (styleObj && styleObj.fontStyle) {
                const weight = parseInt(styleObj.fontStyle, 10);
                if (!isNaN(weight)) {
                    styleObj.fontStyle = (weight >= 600) ? 'bold' : 'normal';
                } else if (styleObj.fontStyle !== 'bold' && styleObj.fontStyle !== 'italic' && styleObj.fontStyle !== 'normal') {
                    styleObj.fontStyle = 'normal';
                }
            }
            return styleObj;
        }


        // Helper: large readable text (Phaser.GameObjects.Text)
        function uiText(scene, x, y, str, size = UI.type.body, color = UI.color.text, align='center') {
            // FIX: Use new wrap width calculation
            const wrapWidth = Math.max(320, Math.min(scene.layout.wrap, scene.layout.W - scene.layout.P * 2));
            
            let style = {
                fontFamily: UI.type.family, fontSize: `${size*1.3}px`, color, // ~30% larger
                align, wordWrap: { width: wrapWidth, useAdvancedWrap:true }
            };
            
            // Apply sanitizer
            style = sanitizeFontStyle(style);
            
            const text = scene.add.text(x, y, str, style).setOrigin(0.5).setDepth(6);
            text.setFixedSize(wrapWidth, null);
            return text;
        }

        // Helper: pill banner (for "STAGE 1...")
        function uiBanner(scene, x, y, str) {
            const padX=20, padY=8;
            let style = {
                fontFamily: UI.type.family, fontSize:`${UI.type.small * 1.3}px`, color:'#053B35', fontStyle:'bold' // ~30% larger
            };
            const text = scene.add.text(x, y, str, sanitizeFontStyle(style)).setOrigin(0.5);
            const w = text.width + padX*2, h = text.height + padY*2;
            
            const bg = scene.add.graphics({ x: x, y: y });
            bg.fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.banner).color, 1);
            bg.lineStyle(2, Phaser.Display.Color.HexStringToColor('#62D5C3').color, 1);
            bg.fillRoundedRect(-w / 2, -h / 2, w, h, 10);
            bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 10);

            bg.setDepth(5); text.setDepth(6);
            
            bg.setData('setSize', (newW, newH) => {
                bg.clear();
                bg.fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.banner).color, 1);
                bg.lineStyle(2, Phaser.Display.Color.HexStringToColor('#62D5C3').color, 1);
                bg.fillRoundedRect(-newW / 2, -newH / 2, newW, newH, 10);
                bg.strokeRoundedRect(-newW / 2, -newH / 2, newW, newH, 10);
            });

            return {bg, text};
        }

        // Helper: choice “card” button (primary/ghost variants)
        function uiChoice(scene, x, y, label, variant='ghost', onClick, width = UI.button.minW) {
            const w = width, h = UI.button.minH;
            
            // FIX: Use CSS hex string '#000000' instead of '0x000000'
            const bgColor = (variant === 'primary') ? UI.color.primary : '#000000';
            const bgAlpha = (variant === 'primary') ? 1 : 0.1;
            const strokeWidth = UI.button.stroke;
            const strokeColorHex = (variant === 'primary') ? 0x000000 : Phaser.Display.Color.HexStringToColor(UI.color.outline).color;
            const strokeAlpha = (variant === 'primary') ? 0 : 1;
            // FIX: Use numeric hex for fillStyle
            const hoverColorHex = (variant === 'primary') ? 0x66aaff : 0x333333;
            const hoverAlpha = (variant === 'primary') ? 1 : 0.3;

            const rect = scene.add.graphics({ x: x, y: y });
            rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
            rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
            rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
            rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
            rect.setDepth(5);
            
            const txt = scene.add.text(x, y, label, {
                fontFamily: UI.type.family, fontSize:`${UI.button.font}px`,
                color: UI.color.text, fontStyle:'bold'
            }).setOrigin(0.5).setDepth(6);

            const zone = scene.add.zone(x, y, w, h).setInteractive({useHandCursor:true}).setDepth(8);

            zone.on('pointerup', () => {
                   if (GameState.clickBlock) return;
                   log('Button', `Clicked: ${label}`);
                   
                   scene.tweens.add({
                       targets: [rect, txt],
                       scaleX: 0.98,
                       scaleY: 0.98,
                       duration: 80,
                       ease: 'Power1',
                       yoyo: true,
                       onComplete: () => {
                           if (onClick) onClick();
                       }
                   });

                   GameState.clickBlock = true;
                   scene.time.delayedCall(300, () => { GameState.clickBlock = false; });
               })
               .on('pointerover', () => {
                   rect.clear();
                   rect.fillStyle(hoverColorHex, hoverAlpha);
                   rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                   rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                   rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
               })
               .on('pointerout', () => {
                   rect.clear();
                   rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                   rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                   rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                   rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
               });

            const buttonObjects = {rect, txt, zone};

            buttonObjects.setSelected = (isSelected) => {
                if (isSelected) {
                    txt.setFill(UI.color.brand);
                    rect.clear();
                    rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                    rect.lineStyle(UI.button.stroke, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 1);
                    rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                    rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                } else {
                    txt.setFill(UI.color.text);
                    rect.clear();
                    rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                    rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                    rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                    rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                }
            };

            return buttonObjects;
        }
        
        // FIX: Add uiButton helper
        function uiButton(scene, x, y, label, variant = 'secondary', onClick, width = UI.button.minW) {
            // This is just an alias for uiChoice, as requested
            return uiChoice(scene, x, y, label, variant, onClick, width);
        }

     // Helper: Draggable node for link game
     function uiDraggable(scene, x, y, label, id, width = UI.button.minW) {
         const h = UI.button.minH;
         const bgColor = 0x222222;
         const bgAlpha = 0.5;
         // FIX: Use integer color
         const strokeColor = Phaser.Display.Color.HexStringToColor(UI.color.outline).color;
         const strokeAlpha = 1.0;
         const strokeWidth = UI.button.stroke;
         
         const rect = scene.add.graphics({ x: x, y: y });
         rect.fillStyle(bgColor, bgAlpha);
         rect.lineStyle(strokeWidth, strokeColor, strokeAlpha);
         rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
         rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
         rect.setDepth(5);

         const txt = scene.add.text(x, y, label, {
             fontFamily: UI.type.family, fontSize:`${UI.button.font}px`,
             color: UI.color.text, fontStyle:'bold'
         }).setOrigin(0.5).setDepth(6);

         const zone = scene.add.zone(x, y, width, h).setInteractive({ useHandCursor: true }).setDepth(8);
         scene.input.setDraggable(zone);

         zone.on('dragstart', (pointer) => {
             GameState.dragLine.clear().lineStyle(4, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.7);
             GameState.dragSource = id;
             log('Drag', `Drag Start from ${id}`);
         });

         zone.on('drag', (pointer) => {
             const curve = new Phaser.Curves.CubicBezier(
                 new Phaser.Math.Vector2(x, y),
                 new Phaser.Math.Vector2(x + 150, y),
                 new Phaser.Math.Vector2(pointer.x - 150, pointer.y),
                 new Phaser.Math.Vector2(pointer.x, pointer.y)
             );
             GameState.dragLine.clear().lineStyle(4, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.7);
             curve.draw(GameState.dragLine);
         });

         zone.on('dragend', (pointer) => {
             GameState.dragLine.clear();
             GameState.dragSource = null;
             log('Drag', `Drag End`);
         });

         return { rect, txt, zone, id };
     }

     // Helper: Drop target for link game
     function uiDropTarget(scene, x, y, label, id, width = UI.button.minW) {
         const h = UI.button.minH * 1.5; // Taller for more text
         const bgColor = 0x222222;
         const bgAlpha = 0.1;
         const strokeColor = Phaser.Display.Color.HexStringToColor(UI.color.textSoft).color;
         const strokeAlpha = 0.5;
         const strokeWidth = UI.button.stroke;

         const rect = scene.add.graphics({ x: x, y: y });
         rect.fillStyle(bgColor, bgAlpha);
         rect.lineStyle(strokeWidth, strokeColor, strokeAlpha);
         rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
         rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
         rect.setDepth(5);

         const txt = scene.add.text(x, y, label, {
             fontFamily: UI.type.family, fontSize:`${UI.type.small}px`,
             color: UI.color.textSoft, fontStyle:'normal', align: 'center',
             wordWrap: { width: width - 20 }
         }).setOrigin(0.5).setDepth(6);

         const zone = scene.add.zone(x, y, width, h).setDropZone().setDepth(8);
         
         const target = { rect, txt, zone, id, linked: false };

         zone.on('drop', (pointer) => {
             log('Drag', `Dropped on ${id} from ${GameState.dragSource}`);
             AlfieLab.handleDragLink(GameState.dragSource, target);
             GameState.dragSource = null; // Clear source after a drop
             GameState.dragLine.clear();
         });
         
         target.shake = () => {
             scene.tweens.add({
                 targets: [rect, txt],
                 x: x + 10,
                 duration: 50,
                 ease: 'Power1',
                 yoyo: true,
                 repeat: 3,
                 onComplete: () => {
                     rect.setPosition(x, y);
                     txt.setPosition(x, y);
                 }
             });
         };

         target.setSuccess = () => {
             target.linked = true;
             rect.clear();
             rect.fillStyle(bgColor, 0.3);
             rect.lineStyle(strokeWidth + 1, C_COLOR_GREEN, 1.0);
             rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
             rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
             txt.setFill(UI.color.text);
         };

         return target;
     }

        // Helper: small label under sprites (e.g., “Macrophage”)
        function uiLabel(scene, x, y, str) {
            return scene.add.text(x, y, str, {
                fontFamily: UI.type.family, fontSize:`${UI.type.small * 1.3}px`, // ~30% larger
                color:UI.color.textSoft, align:'center'
            }).setOrigin(0.5).setDepth(6);
        }
        
        // --- NEW GLOBAL HTML BUTTON HANDLERS ---
        function startMission() {
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'none';
            
            if (GameState.game && AlfieLab.showNameInput) {
                AlfieLab.showNameInput();
            } else {
                console.error("Phaser game not ready or showNameInput not found.");
            }
        }

        function showHelp() {
            if (GameState.game && AlfieLab.updateBanner) {
                AlfieLab.updateBanner("Instructions: Complete each stage by selecting the correct biological response.", false);
            } else {
                alert("Instructions: Complete each stage by selecting the correct biological response.");
            }
        }


        /**
         * Main Phaser Scene Object
         */
        const AlfieLab = {
            
            // --- Phaser Core Functions ---
            preload: function() {
                log('AlfieLab', 'preload');
            },

            create: function() {
                log('AlfieLab', 'create');
                GameState.game = this; // Save scene context
                this.layout = createLayout(this); // Create layout helper

                this.uiLayer = this.add.container(0, 0);
                this.gameplayLayer = this.add.container(0, 0).setDepth(2);
                this.backgroundLayer = this.add.container(0, 0).setDepth(1);
                
                this.banner = uiBanner(this, this.layout.midX, this.layout.top + 30, "");
                this.banner.bg.setVisible(false);
                this.banner.text.setVisible(false);
                this.uiLayer.add([this.banner.bg, this.banner.text]);
                
                // Start the game flow
                AlfieLab.showTitleScreen();

                GameState.dragLine = this.add.graphics().setDepth(7);
                this.input.on('pointermove', (pointer) => {
                    if (GameState.dragSource && GameState.dragLine) {
                        const sourceNode = GameState.dragNodes.find(n => n.id === GameState.dragSource);
                        if (!sourceNode) return;
                        
                        const x = sourceNode.zone.x;
                        const y = sourceNode.zone.y;

                        const curve = new Phaser.Curves.CubicBezier(
                            new Phaser.Math.Vector2(x, y),
                            new Phaser.Math.Vector2(x + 150, y),
                            new Phaser.Math.Vector2(pointer.x - 150, pointer.y),
                            new Phaser.Math.Vector2(pointer.x, pointer.y)
                        );
                        GameState.dragLine.clear().lineStyle(4, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.7);
                        curve.draw(GameState.dragLine);
                    }
                });

                this.scale.on('resize', () => this.relayout && this.relayout());
            },
            
            relayout: function() {
                log('Layout', 'Relayout triggered');
                this.layout = createLayout(this); 
                
                this.banner.bg.setPosition(this.layout.midX, this.layout.top + 30);
                this.banner.text.setPosition(this.layout.midX, this.layout.top + 30);

                if (GameState.scene === 'Title') AlfieLab.showTitleScreen(true);
                else if (GameState.scene === 'NameInput') AlfieLab.showNameInput(true);
                else if (GameState.scene === 'Briefing') AlfieLab.showBriefing(true);
                else if (GameState.scene === 'Gameplay') AlfieLab.showGameplay(GameState.currentStage, true);
                else if (GameState.scene === 'Summary') AlfieLab.showSummary(true);
            },

            update: function(time, delta) {
                if (GameState.scene === 'NameInput' && this.cursor) {
                    this.cursor.setAlpha(Math.sin(time * 0.005) * 0.5 + 0.5);
                }
                
                if (GameState.scene === 'Gameplay' && 
                    (GameState.currentStage === 3 || GameState.currentStage === 4) && 
                    this.aaMolecule && 
                    this.aaMolecule.active &&
                    this.aaMolecule.data) { 
                    
                    this.aaMolecule.y = this.aaMolecule.data.get('baseY') + Math.sin(time * 0.002) * 5;
                }
            },
            
            // --- UI Helper Functions (Refactored) ---
            
            updateBanner: function(text, persist = false) {
                const scene = GameState.game;
                if (!scene || !scene.banner) return;
                
                if (scene.banner.hideTimer) {
                    scene.banner.hideTimer.remove(false);
                }

                if (!text || text === "") {
                    scene.banner.bg.setVisible(false);
                    scene.banner.text.setVisible(false);
                } else {
                    scene.banner.text.setText(text.toUpperCase());
                    const padX=20, padY=8;
                    const w = scene.banner.text.width + padX*2, h = scene.banner.text.height + padY*2;
                    scene.banner.bg.getData('setSize')(w, h);
                    
                    scene.banner.bg.setVisible(true);
                    scene.banner.text.setVisible(true);
                    
                    if (!persist) {
                        scene.banner.hideTimer = scene.time.delayedCall(3000, () => {
                            if (scene.banner.text.text === text.toUpperCase()) {
                                scene.banner.bg.setVisible(false);
                                scene.banner.text.setVisible(false);
                            }
                        });
                    }
                }
            },
            
            // FIX: Use container-safe .list
            clearUILayer: function(isRelayout = false) {
               const scene = GameState.game;
               if (!scene || !scene.uiLayer) return;

               if (isRelayout) {
                   const keep = new Set([scene.banner.bg, scene.banner.text]);
                   for (const child of [...scene.uiLayer.list]) { 
                       if (child && !keep.has(child) && !child.destroyed && typeof child.destroy === 'function') {
                           child.destroy();
                       }
                   }
               } else {
                   scene.uiLayer.removeAll(true);
                   scene.uiLayer.add([scene.banner.bg, scene.banner.text]);
               }
            },

                if (overlay) overlay.style.display = 'none';

                if (!isRelayout) {

                    AlfieLab.clearGameplayLayer();
                }
                AlfieLab.clearUILayer(isRelayout);
                
                AlfieLab.updateBanner("FLIGHT SURGEON'S LOG: ENTER YOUR NAME", true);

                const namePrompt = uiText(scene, scene.layout.midX, scene.layout.midY - 50, "SURGEON:", UI.type.h2, UI.color.brand);
                namePrompt.style.fontStyle = 'bold';

                const nameText = uiText(scene, scene.layout.midX, scene.layout.midY, GameState.studentName.toUpperCase(), UI.type.h1, UI.color.text);
                nameText.setColor(UI.color.text); // Ensure it's white

                scene.cursor = scene.add.graphics()
                    .fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.brand).color)
                    .fillRect(0, -22, 3, 44);
                scene.cursor.x = nameText.x + nameText.width / 2 + 5;
                scene.cursor.y = nameText.y;
                
                scene.uiLayer.add([namePrompt, nameText, scene.cursor]);

                if (!isRelayout) {
                    if(scene.input.keyboard) {
                         scene.input.keyboard.off('keydown');
                    }
                    scene.input.keyboard.on('keydown', (event) => {
                        if (GameState.scene !== 'NameInput') return;
                        if (event.keyCode === 8) { // Backspace
                            GameState.studentName = GameState.studentName.slice(0, -1);
                        } else if (event.keyCode === 13 || event.keyCode === 32) { // Enter or Space
                            if (GameState.studentName.length > 0 && event.keyCode === 32) {
                                 GameState.studentName += " ";
                            }
                        } else if (event.keyCode >= 48 && event.keyCode <= 90 || event.keyCode >= 96 && event.keyCode <= 105) { // A-Z, 0-9, Numpad
                            if (GameState.studentName.length < 20) { 
                                GameState.studentName += event.key;
                            }
                        }

                        nameText.setText(GameState.studentName.toUpperCase());
                        scene.cursor.x = nameText.x - nameText.width / 2 + nameText.width + 5;
                    });
                }

                const continueButton = uiButton(scene, scene.layout.midX, scene.layout.midY + 150, "CONFIRM IDENTITY", 'primary', () => {
                    if (GameState.studentName.length > 0) {
                        scene.input.keyboard.off('keydown'); 
                        GameState.worksheetData = [`MISSION LOG: FLIGHT SURGEON ${GameState.studentName.toUpperCase()}`];
                        AlfieLab.showBriefing();
                    } else {
                        AlfieLab.updateBanner("IDENTITY REQUIRED. PLEASE ENTER YOUR NAME.", false);
                    }
                }, 300);
                scene.uiLayer.add([continueButton]);
            },

            /** Helper for the multi-step Neutrophil game (Refactored) */
            runNeutrophilSubStep: function(step) {
                const scene = GameState.game;
                const neutrophil = GameState.neutrophil;
                AlfieLab.clearUILayer(true); // Must destroy buttons on sub-step
                GameState.stageComplete = false; // Reset guard

                GameState.neutrophilStep = step;
                let bannerText = "";
                let choices = [];

                switch(step) {
                    case 0: // Step 1: Rolling
                        bannerText = "STEP 1: The neutrophil is ROLLING. What 'speed bumps' is it binding to?";
                        choices = [
                            { text: "Selectins (P-selectin, E-selectin)", correct: true, log: "Neutrophil Step 1 (Rolling): Selectins" },
                            { text: "Integrins", correct: false, msg: "Incorrect. Integrins are for firm adhesion, not rolling." },
                        ];
                        scene.tweens.add({
                            targets: neutrophil, 
                            x: scene.layout.midX - 150, 
                            duration: 1500, 
                            ease: 'Bounce.easeOut' // Use bounce ease
                        });
                        break;
                    
                    case 1: // Step 2: Adhesion
                        bannerText = "STEP 2: It's stopped! What binds ICAM-1 for firm ADHESION?";
                        choices = [
                            { text: "Integrins", correct: true, log: "Neutrophil Step 2 (Adhesion): Integrins" },
                            { text: "Selectins", correct: false, msg: "Incorrect. Selectins were for rolling." },
                        ];
                        const icam = uiLabel(scene, scene.layout.midX, scene.layout.midY - 20, "ICAM-1");
                        const integrinText = uiLabel(scene, scene.layout.midX, scene.layout.midY + 100, "Integrins activated by C5a & LTB4");
                        integrinText.setAlpha(0).setDepth(6);
                        scene.gameplayLayer.add([icam, integrinText]);
                        scene.tweens.add({ targets: neutrophil, x: scene.layout.midX, duration: 1000, ease: 'Power1' });
                        scene.tweens.add({ targets: integrinText, alpha: 1, duration: 500, delay: 1000 });
                        break;

                    case 2: // Step 3: Transmigration
                        bannerText = "STEP 3: It's squeezing through (Transmigration)! What chemical is attracting it (CHEMOTAXIS)?";
                        choices = [
                            { text: "LTB4, C5a, IL-8", correct: true, log: "Neutrophil Step 3 (Chemotaxis): LTB4, C5a, IL-8" },
                            { text: "PGE2", correct: false, msg: "Incorrect. PGE2 is for pain and fever." },
                        ];
                        const pecam = uiLabel(scene, scene.layout.midX + 10, scene.layout.midY + 50, "PECAM-1");
                        scene.gameplayLayer.add(pecam);
                        scene.tweens.add({
                            targets: neutrophil, y: scene.layout.midY + 150, duration: 1000, ease: 'Power1'
                        });
                        break;

                    case 3: // Step 4: Phagocytosis
                        bannerText = "STEP 4: It found the pathogen! What molecules 'opsonize' (coat) it for PHAGOCYTOSIS?";
                        choices = [
                            { text: "IgG and C3b", correct: true, log: "Neutrophil Step 4 (Phagocytosis): Opsonins IgG, C3b" },
                            { text: "MPO", correct: false, msg: "Incorrect. MPO is an enzyme used *after* phagocytosis." }
                        ];
                        const pathogen = scene.add.graphics()
                            .fillStyle(C_COLOR_YELLOW, 1).lineStyle(1, 0xaaaa00, 1)
                            .fillPoints([ new Phaser.Geom.Point(0, -15), new Phaser.Geom.Point(10, -5), new Phaser.Geom.Point(15, 10), new Phaser.Geom.Point(0, 5), new Phaser.Geom.Point(-15, 10), new Phaser.Geom.Point(-10, -5) ], true)
                            .strokePath()
                            .setPosition(scene.layout.midX + 150, scene.layout.midY + 150)
                            .setDepth(2);
                        scene.gameplayLayer.add(pathogen);
                        scene.tweens.add({
                            targets: neutrophil, x: scene.layout.midX + 100, duration: 1000
                        });
                        break;
                    
                    case 4: // Done
                        AlfieLab.showGameplay(GameState.currentStage + 1);
                        return;
                }

                AlfieLab.updateBanner(bannerText, true);
                let yPos = scene.layout.bottom - 120; 
                choices.forEach(choice => {
                    const btn = uiButton(scene, scene.layout.midX, yPos, choice.text, 'secondary', () => {
                        AlfieLab.handleChoice(choice.correct, choice.log, choice.msg, () => {
                            if (choice.correct) {
                                AlfieLab.runNeutrophilSubStep(GameState.neutrophilStep + 1);
                            }
                        });
                    }, 500); 
                    scene.uiLayer.add([btn]);
                    yPos += (UI.button.minH + 10); 
                });
            },

            /** Stage 9: Oxidative Burst Minigame (Refactored, Renumbered) */
            runStage9_OxidativeBurst: function(scene, isRelayout = false) {
                if (!isRelayout) {
                    GameState.burstStep = 0; 
                    AlfieLab.clearGameplayLayer();

                    const pathogen = scene.add.graphics()
                        .fillStyle(C_COLOR_YELLOW, 1).lineStyle(2, 0xaaaa00, 1)
                        .fillPoints([ new Phaser.Geom.Point(0, -50), new Phaser.Geom.Point(40, -10), new Phaser.Geom.Point(60, 40), new Phaser.Geom.Point(0, 20), new Phaser.Geom.Point(-60, 40), new Phaser.Geom.Point(-40, -10) ], true)
                        .strokePath()
                        .setPosition(scene.layout.midX, scene.layout.midY)
                        .setDepth(2);
                    scene.gameplayLayer.add(pathogen);
                    GameState.pathogen = pathogen;
                }
                AlfieLab.updateBanner("STEP 5: Oxidative Burst! Activate the enzymes IN ORDER to create bleach.", true);

                const reactionText = uiText(scene, scene.layout.midX, scene.layout.midY - 150, "O2 -> ???", UI.type.h1, UI.color.text);
                reactionText.style.fontStyle = 'bold';
                GameState.reactionText = reactionText;

                const btn1 = uiButton(scene, scene.layout.midX, scene.layout.bottom - 210, "NADPH Oxidase", 'secondary', () => {
                    AlfieLab.handleBurstClick(0, "O2-");
                }, 400);
                const btn2 = uiButton(scene, scene.layout.midX, scene.layout.bottom - 140, "Superoxide Dismutase (SOD)", 'secondary', () => {
                    AlfieLab.handleBurstClick(1, "H2O2");
                }, 400);
                const btn3 = uiButton(scene, scene.layout.midX, scene.layout.bottom - 70, "Myeloperoxidase (MPO)", 'secondary', () => {
                    AlfieLab.handleBurstClick(2, "HOCl (Bleach!)");
                }, 400);
                
                scene.uiLayer.add([reactionText, btn1, btn2, btn3]);
            },

            /** Stage 10: Resolution (Refactored, Renumbered) */
            runStage10_Resolution: function(scene, isRelayout = false) {
                AlfieLab.clearGameplayLayer();
                // USMLE Content: Mention Lipoxins
                AlfieLab.updateBanner("STEP 7: Resolution. Lipoxins (anti-inflammatory) signal for cleanup. What cell arrives?", true);

                if (!isRelayout) {
                    const macrophage = AlfieLab.drawCell('Macrophage (M2)', scene.layout.midX, scene.layout.midY, C_COLOR_PURPLE);
                    scene.gameplayLayer.add(macrophage);
                }

                const btn1 = uiButton(scene, scene.layout.midX, scene.layout.bottom - 130, "Macrophage", 'secondary', () => {
                    AlfieLab.handleChoice(true, "Resolution: Macrophage (M2)");
                }, 350);
                const btn2 = uiButton(scene, scene.layout.midX, scene.layout.bottom - 60, "Neutrophil", 'secondary', () => {
                    AlfieLab.handleChoice(false, null, "Incorrect. Neutrophils undergo apoptosis; they don't clean up.");
                }, 350);
                
                scene.uiLayer.add([btn1, btn2]);
            },

            /** Final Summary Screen (Refactored) */
            showSummary: function(isRelayout = false) {
                log('Flow', 'showSummary');
                const scene = GameState.game;
                if (!isRelayout) {
                    GameState.scene = 'Summary';
                    GameState.stageComplete = false;
                    AlfieLab.clearGameplayLayer();
                    AlfieLab.clearBackgroundLayer();
                }
                AlfieLab.clearUILayer(isRelayout);
                AlfieLab.updateBanner("");

                const title = uiText(scene, scene.layout.midX, scene.layout.P + 50, "MISSION COMPLETE", UI.type.h1, '#' + C_COLOR_GREEN.toString(16));
                title.style.fontStyle = 'bold';

                const congrats = uiText(scene, scene.layout.midX, scene.layout.P + 110, `Good work, Surgeon ${GameState.studentName.toUpperCase()}. Alfi is stable.`, UI.type.h2, UI.color.text);
                congrats.style.fontStyle = 'bold';

                const logHeader = uiText(scene, scene.layout.midX, scene.layout.midY - 100, "FLIGHT SURGEON'S LOG:", UI.type.h2, UI.color.brand);
                logHeader.style.fontStyle = 'bold';
                
                const logBox = scene.add.graphics()
                    .lineStyle(2, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.5)
                    .strokeRect(scene.layout.midX - 300, scene.layout.midY - 70, 600, 200);
                logBox.setDepth(5);

                const logText = uiText(scene, scene.layout.midX, scene.layout.midY + 30, GameState.worksheetData.join('\n'), UI.type.small, UI.color.textSoft);
                
                scene.uiLayer.add([title, congrats, logHeader, logBox, logText]);

                const exportButton = uiButton(scene, scene.layout.midX, scene.layout.bottom - 130, "Export Mission Log (.txt)", 'primary', () => {
                    AlfieLab.exportWorksheet();
                }, 350);
                
                const restartButton = uiButton(scene, scene.layout.midX, scene.layout.bottom - 60, "Run New Simulation", 'secondary', () => {
                    AlfieLab.showTitleScreen();
                }, 350);
                
                scene.uiLayer.add([exportButton, restartButton]);
            },
            
            // Helper for stacking UI elements
            placeStackCentered: function(scene, items, startY, gap) {
                 let y = startY; 
                 items.forEach(item => { 
                     // item is a uiChoice object {rect, txt, zone}
                     item.rect.setPosition(scene.layout.midX, y);
                     item.txt.setPosition(scene.layout.midX, y);
                     item.zone.setPosition(scene.layout.midX, y);
                     y += item.rect.displayHeight + gap; 
                 });
            },

            // --- Game Logic Handlers ---

            /** Handles correct/incorrect choices */
            handleChoice: function(isCorrect, logEntry, incorrectMsg = "Incorrect. Try again, Surgeon.", correctCallback = null) {
                if (GameState.stageComplete) return; 

                if (isCorrect) {
                    GameState.stageComplete = true; 
                    log('Game', `Correct choice. Log: ${logEntry}`);
                    if (logEntry) GameState.worksheetData.push(logEntry); 
                    
                    AlfieLab.playSuccess(true);
                    
                    if (correctCallback) {
                        correctCallback();
                    } else {
                        GameState.game.time.delayedCall(500, () => {
                            AlfieLab.showGameplay(GameState.currentStage + 1);
                        });
                    }
                } else {
                    log('Game', 'Incorrect choice.');
                    AlfieLab.updateBanner(incorrectMsg, true); 
                    AlfieLab.playSuccess(false);
                    GameState.game.time.delayedCall(2000, () => {
                         const originalBanner = AlfieLab.getBannerTextForStage(GameState.currentStage);
                         AlfieLab.updateBanner(originalBanner, true);
                    });
                }
            },

            /** FIX: Moved function to AlfieLab scope */
            handleDragLink: function(sourceId, target) {
                const scene = GameState.game;
                if (target.linked) return; 

                const correctLinks = {
                    'COX': ['PG', 'PGI', 'TXA2', 'PGF'],
                    'LOX': ['LTB4', 'LTCDE']
                };
                const totalLinks = 6;

                if (sourceId && correctLinks[sourceId] && correctLinks[sourceId].includes(target.id)) {
                    log('DragGame', `Correct link: ${sourceId} -> ${target.id}`);
                    AlfieLab.playSuccess(true);
                    target.setSuccess(); 
                    
                    const sourceNode = GameState.dragNodes.find(n => n.id === sourceId);
                    const curve = new Phaser.Curves.CubicBezier(
                        new Phaser.Math.Vector2(sourceNode.zone.x, sourceNode.zone.y),
                        new Phaser.Math.Vector2(sourceNode.zone.x + 150, sourceNode.zone.y),
                        new Phaser.Math.Vector2(target.zone.x - 150, target.zone.y),
                        new Phaser.Math.Vector2(target.zone.x, target.zone.y)
                    );
                    GameState.permanentLines.lineStyle(4, C_COLOR_GREEN, 1.0);
                    curve.draw(GameState.permanentLines);

                    GameState.linkCount++;
                    if (GameState.linkCount >= totalLinks) {
                        if (GameState.stageComplete) return;
                        GameState.stageComplete = true;
                        AlfieLab.updateBanner("All pathways mapped!", false);
                        GameState.worksheetData.push("AA Pathways: COX/LOX Mapped");
                        
                        const summary = uiText(scene, scene.layout.midX, scene.layout.midY, 
                            "NSAIDs block COX.\nZileuton blocks 5-LOX.\nMontelukast blocks CysLT1.", 
                            UI.type.body, UI.color.text);
                        summary.setDepth(2000).setBackgroundColor(UI.color.bg).setPadding(20);
                        scene.uiLayer.add(summary);

                        scene.time.delayedCall(3500, () => AlfieLab.showGameplay(GameState.currentStage + 1));
                    }
                } else {
                    log('DragGame', `Incorrect link: ${sourceId} -> ${target.id}`);
                    AlfieLab.playSuccess(false);
                    target.shake();
                }
            },

            /** FIX: Moved function to AlfieLab scope */
            handleBurstClick: function(stepClicked, product) {
                const scene = GameState.game;
                if (GameState.stageComplete) return;
                if (stepClicked === GameState.burstStep) {
                    AlfieLab.playSuccess(true);
                    GameState.burstStep++;
                    let newText = "";
                    let log = "";

                    if (stepClicked === 0) {
                        newText = "O2 -> O2- -> ???";
                        log = "Oxidative Burst 1: NADPH Oxidase -> O2-";
                    } else if (stepClicked === 1) {
                        newText = "O2 -> O2- -> H2O2 -> ???";
                        log = "Oxidative Burst 2: SOD -> H2O2";
                    } else if (stepClicked === 2) {
                        newText = "O2 -> O2- -> H2O2 -> HOCl!";
                        log = "Oxidative Burst 3: MPO -> HOCl";
                        AlfieLab.updateBanner("TARGET DESTROYED!", false);
                        GameState.stageComplete = true; // Lock input
                        
                        scene.tweens.add({
                            targets: GameState.pathogen,
                            scale: 0, alpha: 0, angle: 360, duration: 1000,
                            onComplete: () => {
                                AlfieLab.showGameplay(GameState.currentStage + 1);
                            }
                        });
                    }
                    
                    if (GameState.reactionText) GameState.reactionText.setText(newText);
                    GameState.worksheetData.push(log);

                } else {
                    AlfieLab.playSuccess(false);
                    AlfieLab.updateBanner("Incorrect order! Try again.", true);
                }
            },
            
            /** Gets the banner text for the current stage (to restore after error) */
            getBannerTextForStage: function(stage) {
                // FIX: Sanitized strings
                switch (stage) {
                    case 0: return "STAGE 1: Alien PAMP detected! What cell recognizes it?";
                    case 1: return "The Macrophage is using its TLRs! What is the 'master switch' it activates?";
                    case 2: return "Triggers (Injury, C5a, IgE) cause Ca2+ influx, activating...";
                    case 3: return "AA is free in the cytosol! Which cells metabolize it?";
                    case 4: return "Drag the enzymes to link them to their products/effects.";
                    case 5: return "Aspirin/NSAIDs block COX. Which product causes Fever & Pain?";
                    case 6: return "Montelukast blocks CysLT1 receptors. Which LTs cause Bronchospasm?";
                    case 7: return "Alfi's bite area is RED (Rubor) and WARM (Calor). What causes this vasodilation?";
                    case 8: 
                        const steps = ["ROLLING", "ADHESION", "TRANSMIGRATION", "PHAGOCYTOSIS"];
                        return `STEP ${GameState.neutrophilStep + 1}: ${steps[GameState.neutrophilStep]}...`;
                    case 9: return "STEP 5: Oxidative Burst! Activate the enzymes IN ORDER to create bleach.";
                    case 10: return "STEP 7: Resolution. Lipoxins (anti-inflammatory) signal for cleanup. What cell arrives?";
                    default: return "";
                }
            },
            
            /** Exports the worksheetData array as a .txt file */
            exportWorksheet: function() {
                log('Export', 'Exporting mission log...');
                
                let textContent = GameState.worksheetData.join("\r\n"); 
                textContent += "\r\n\r\nEND OF LOG.";
                
                const encodedUri = encodeURI("data:text/plain;charset=utf-8," + textContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Alfi_Mission_Log_${GameState.studentName.toUpperCase()}.txt`);
                document.body.appendChild(link);
                
                link.click();
                document.body.removeChild(link);
                
                AlfieLab.updateBanner("Mission Log Exported!", false);
            },

            /** Visual/Audio feedback for success/fail */
            playSuccess: function(isSuccess) {
                const scene = GameState.game;
                const color = isSuccess ? C_COLOR_GREEN : C_COLOR_RED;
                
                const flash = scene.add.graphics()
                    .lineStyle(10, color, 0.8)
                    .strokeRect(0, 0, scene.layout.W, scene.layout.H)
                    .setDepth(2000);
                
                scene.tweens.add({
                    targets: flash,
                    alpha: 0,
                    duration: 400,
                    onComplete: () => flash.destroy()
                });
            },
            
            // --- Bespoke Graphics Functions (Refactored) ---
            
            /** E: Draws a generic cell (Refactored) */
            drawCell: function(name, x, y, color, isGlowing = false) {
                const container = GameState.game.add.container(x, y);
                // FIX: Use integer color
                const base = Phaser.Display.Color.ValueToColor(color);
                base.darken(20);
                const strokeInt = Phaser.Display.Color.GetColor(base.r, base.g, base.b);

                const body = GameState.game.add.graphics()
                    .fillStyle(color, 1)
                    .lineStyle(2, strokeInt, 1)
                    .fillCircle(0, 0, 50)
                    .strokeCircle(0, 0, 50);
                const nucleus = GameState.game.add.graphics()
                    .fillStyle(Phaser.Display.Color.ValueToColor(color).darken(30).color, 0.5)
                    .fillCircle(Phaser.Math.Between(-10, 10), Phaser.Math.Between(-10, 10), 20);
                
                const text = uiLabel(GameState.game, 0, 75, name);
                
                container.add([body, nucleus, text]).setDepth(2);

                if (isGlowing) {
                    const glow = GameState.game.add.graphics()
                        .fillStyle(C_COLOR_YELLOW, 0.3)
                        .fillCircle(0, 0, 60);
                    container.addAt(glow, 0);
                    GameState.game.tweens.add({
                        targets: glow,
                        scale: 1.2,
                        alpha: 0.5,
                        duration: 700,
                        yoyo: true,
                        repeat: -1
                    });
                }
                return container;
            },

            /** Draws a "target" box for the mini-game (Refactored) */
            drawTarget: function(name, x, y) {
                const container = GameState.game.add.container(x, y);
                const box = GameState.game.add.graphics()
                    .lineStyle(2, Phaser.Display.Color.HexStringToColor(UI.color.textSoft).color, 0.5)
                    .strokeRect(-150, -50, 300, 100);
                
                const text = uiText(GameState.game, 0, 0, name, UI.type.small, UI.color.textSoft);
                
                container.add([box, text]).setDepth(5);
                container.setSize(300, 100);
                container.setName(name); // Set name for lookup
                return container;
            },

            /** Draws a phospholipid bilayer (Refactored) */
            drawPhospholipidBilayer: function(scene, x, y) {
                const bilayerContainer = scene.add.container(x, y);
                scene.membraneLayer = bilayerContainer; // Save reference

                const bilayer = scene.add.graphics();
                const headRadius = 10;
                const tailLength = 25;
                const width = scene.layout.wrap; // Use layout width
                const startX = -width / 2;

                for(let i = 0; i < width; i += headRadius * 2.5) {
                    bilayer.fillStyle(C_COLOR_BLUE, 1).fillCircle(startX + i, 0, headRadius);
                    bilayer.lineStyle(2, C_COLOR_BLUE, 0.8)
                           .lineBetween(startX + i - 3, 0 + headRadius, startX + i - 3, 0 + headRadius + tailLength)
                           .lineBetween(startX + i + 3, 0 + headRadius, startX + i + 3, 0 + headRadius + tailLength);
                }

                const y2 = 0 + headRadius + tailLength + 5;
                for(let i = 0; i < width; i += headRadius * 2.5) {
                    bilayer.fillStyle(C_COLOR_BLUE, 1).fillCircle(startX + i, y2 + tailLength, headRadius);
                    bilayer.lineStyle(2, C_COLOR_BLUE, 0.8)
                           .lineBetween(startX + i - 3, y2, startX + i - 3, y2 + tailLength - headRadius)
                           .lineBetween(startX + i + 3, y2, startX + i + 3, y2 + tailLength - headRadius);
                }
                
                const aaX = 50;
                const aaY = 0 + headRadius + 10;
                const aa = scene.add.graphics()
                    .lineStyle(4, C_COLOR_YELLOW, 1)
                    .moveTo(aaX, aaY).lineTo(aaX + 5, aaY + 5).lineTo(aaX + 10, aaY).lineTo(aaX + 15, aaY + 5)
                    .lineTo(aaX + 20, aaY).lineTo(aaX + 25, aaY + 5).lineTo(aaX + 30, aaY);
                
                // Z-Order Fix: Set depth
                aa.setDepth(3); 
                bilayer.setDepth(2); 

                aa.data = new Phaser.Data.DataManager(aa); // Add data manager
                aa.data.set('baseY', aaY);
                scene.aaMolecule = aa; 
                
                const aaText = uiLabel(scene, aaX + 15, aaY - 20, "Arachidonic Acid (AA)");
                aaText.setFill(UI.color.brand).style.fontStyle = 'bold';
                aaText.setDepth(6); // Z-Order: Above all

                bilayerContainer.add([bilayer, aa, aaText]);
                scene.gameplayLayer.add(bilayerContainer);
            },

            /** Animates AA release (Refactored) */
            animateAARelease: function(scene) {
                if (!scene.aaMolecule) {
                    // Safety check if aaMolecule was somehow destroyed
                    AlfieLab.drawPhospholipidBilayer(scene, scene.layout.midX, scene.layout.midY - 50);
                    if (!scene.aaMolecule) {
                        log('Error', 'aaMolecule not found in animateAARelease');
                        return;
                    }
                }
                
                const aaWorldPos = new Phaser.Math.Vector2();
                if (scene.aaMolecule.parentContainer) {
                    scene.aaMolecule.parentContainer.getWorldTransformMatrix().transformPoint(scene.aaMolecule.x, scene.aaMolecule.y, aaWorldPos);
                } else {
                    // Fallback if container is gone
                    aaWorldPos.x = scene.aaMolecule.x;
                    aaWorldPos.y = scene.aaMolecule.y;
                }

                
                const enzyme = scene.add.graphics()
                    .fillStyle(C_COLOR_RED, 1).lineStyle(2, 0xaa0000, 1) 
                    .slice(0, 0, 20, Phaser.Math.DegToRad(30), Phaser.Math.DegToRad(330), false)
                    .fillPath().strokePath()
                    .setPosition(aaWorldPos.x - 30, aaWorldPos.y)
                    .setDepth(4);
                
                const enzymeText = uiLabel(scene, enzyme.x, enzyme.y + 35, "PLP A2");
                enzymeText.setFill('#ff8888').setDepth(6);
                scene.gameplayLayer.add([enzyme, enzymeText]);

                scene.tweens.add({
                    targets: [enzyme, enzymeText],
                    x: '+=40', 
                    duration: 300,
                    ease: 'Power1',
                    onComplete: () => {
                        scene.tweens.add({
                            targets: scene.aaMolecule,
                            y: scene.aaMolecule.y + 48, // Drop into cytosol
                            alpha: { from: 1, to: 0.8 },
                            duration: 500,
                            ease: 'Quad.easeOut',
                            onComplete: () => {
                                enzyme.destroy();
                                enzymeText.destroy();
                                if (scene.aaMolecule) {
                                    scene.aaMolecule.setVisible(false);
                                    scene.aaMolecule.setActive(false); // Deactivate it
                                }
                            }
                        });
                    }
                });
            }
        };

        // --- Phaser Config ---
        // FIX: Boot game on DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            const config = {
                type: Phaser.AUTO,
                scale: { 
                    mode: Phaser.Scale.FIT, 
                    autoCenter: Phaser.Scale.CENTER_BOTH, 
                    parent: 'game-container',
                    width: SAFE_W, 
                    height: SAFE_H 
                },
                backgroundColor: UI.color.bg,
                parent: 'game-container',
                scene: [AlfieLab],
                antialias: true,
                physics: {
                    default: 'arcade',
                    arcade: {
                        debug: false
                    }
                },
                render: {
                    pixelArt: false,
                    antialias: true
                },
                resolution: window.devicePixelRatio > 1 ? 2 : 1
            };

            // --- Start Game ---
            const game = new Phaser.Game(config);
            // Make AlfieLab globally accessible for HTML buttons
            window.AlfieLab = AlfieLab;
            window.GameState = GameState; // Make GameState global for the HTML buttons
        });

    </script>
