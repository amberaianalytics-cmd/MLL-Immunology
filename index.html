<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCR 240 - Lab 1: Alfi's Space Adventure</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" crossorigin="anonymous"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0B1220; 
            color: #ffffff;
            font-family: "Inter", SF Pro Display, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        }
        #game-container {
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(80, 227, 194, 0.6);
            overflow: hidden;
            border: 1px solid rgba(80, 227, 194, 0.3);
            position: relative;
            z-index: 1;
        }
        canvas { display: block; }
        #hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0B1220;
            background-image: radial-gradient(circle at 50% 30%, rgba(0, 255, 200, 0.1), rgba(0, 255, 200, 0) 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #FFFFFF;
            text-align: center;
            flex-direction: column;
        }
        .hero-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            padding: 20px;
        }
        .hero-stack h1 {
            color: #00FFC8;
            font-weight: 800;
            font-size: 48px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }
        .hero-stack h2 {
            color: #FFFFFF;
            font-weight: 500;
            font-size: 28px;
            margin: 18px 0;
        }
        .hero-stack p {
            color: #E8E8E8;
            font-weight: 400;
            font-size: 20px;
            line-height: 1.6;
            margin: 0;
        }
        .hero-buttons {
            margin-top: 32px;
            display: flex;
            gap: 16px;
        }
        .hero-btn {
            min-width: 260px;
            height: 60px;
            font-size: 20px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-primary {
            background-color: #3B82F6;
            color: white;
            border: none;
        }
        .btn-primary:hover { background-color: #60a5fa; }
        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid #FFFFFF;
        }
        .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <div id="hero-overlay">
        <div class="hero-stack">
            <h1>DR. MODALI LEARNING LABS</h1>
            <h2>HCR 240 - IMMUNOLOGY LAB 1</h2>
            <p>Alfi is Lost in Space</p>
            <div class="hero-buttons">
                <button class="hero-btn btn-primary" onclick="startMission()">BEGIN MISSION</button>
                <button class="hero-btn btn-secondary" onclick="showHelp()">How to Play</button>
            </div>
        </div>
    </div>
    <div id="game-container"></div>

    <script>
        // --- Game Constants ---
        const SAFE_W = 1280;
        const SAFE_H = 720;
        
        // --- Colors ---
        const C_COLOR_RED = 0xe74c3c;
        const C_COLOR_BLUE = 0x3498db;
        const C_COLOR_PURPLE = 0x9b59b6;
        const C_COLOR_YELLOW = 0xf1c40f;
        const C_COLOR_GREEN = 0x2ecc71;
        const C_COLOR_LIGHT_GREY_GFX = 0xE0E0E0;

        // --- Game State ---
        // FIX: GameState.game will be the *single source of truth* for the scene
        const GameState = {
            scene: 'Title',
            studentName: "",
            worksheetData: [],
            game: null, // This will be set to the Phaser Scene instance
            clickBlock: false,
            currentStage: 0,
            dragLine: null,
            dragSource: null,
            dragNodes: [],
            linkCount: 0,
            neutrophilStep: 0,
            burstStep: 0,
            stageComplete: false,
        };

        // --- Logging ---
        function log(tag, msg) {
            console.log(`[ALFI:${tag}] ${msg}`);
        }

        // --- DESIGN SYSTEM ---
        const UI = {
           FONT: 'Inter, system-ui, -apple-system, Segoe UI, Roboto',
           H1: { fontFamily:'Inter', fontSize:'48px', fontStyle:'bold', color:'#14B8A6' },
           H2: { fontFamily:'Inter', fontSize:'28px', fontStyle:'bold', color:'#FFFFFF' },
           BODY: (wrap)=>({ fontFamily:'Inter', fontSize:'20px', color:'#E5E7EB', wordWrap:{ width:wrap, useAdvancedWrap:true}, align:'center', lineSpacing:6 }),
           color: {
               bg: '#0B1220', text: '#FFFFFF', textSoft:'#E8E8E8', brand: '#14B8A6',
               primary: '#3B82F6', outline: '#FFFFFF', banner: '#9CE8DB'
           },
           type: {
               family: 'Inter, SF Pro Display, system-ui, -apple-system, sans-serif',
               h1: 36, h2: 28, body: 20, small: 18
           },
           button: { minW: 260, minH: 60, radius: 14, font: 20, stroke: 2 },
           card:   { padX: 24, padY: 18, radius: 14, stroke: 2, shadow: true }
        };

        // --- UI Helper Functions ---
        // FIX: ALL helper functions will now use 'GameState.game' instead of passing 'scene'
        // This makes the code consistent and fixes the 'this' context errors.
        
        function createLayout(){
           const W = GameState.game.scale.width;
           const H = GameState.game.scale.height;
           const P = Math.round(Math.min(W, H) * 0.04);
           const wrap = Math.round(W * 0.68);
           return {
               W, H, P, wrap,
               midX: W / 2, midY: H / 2,
               left: P, right: W - P, top: P, bottom: H - P,
               panelW: Math.round(W * 0.82), panelH: Math.round(H * 0.62)
           };
        }

        function sanitizeFontStyle(styleObj) {
            if (styleObj && styleObj.fontStyle) {
                const weight = parseInt(styleObj.fontStyle, 10);
                if (!isNaN(weight)) {
                    styleObj.fontStyle = (weight >= 600) ? 'bold' : 'normal';
                } else if (styleObj.fontStyle !== 'bold' && styleObj.fontStyle !== 'italic' && styleObj.fontStyle !== 'normal') {
                    styleObj.fontStyle = 'normal';
                }
            }
            return styleObj;
        }

        function uiText(x, y, str, size = UI.type.body, color = UI.color.text, align='center') {
            const wrapWidth = Math.max(320, Math.min(GameState.game.layout.wrap, GameState.game.layout.W - GameState.game.layout.P * 2));
            let style = {
                fontFamily: UI.type.family, fontSize: `${size*1.3}px`, color,
                align, wordWrap: { width: wrapWidth, useAdvancedWrap:true }
            };
            style = sanitizeFontStyle(style);
            const text = GameState.game.add.text(x, y, str, style).setOrigin(0.5).setDepth(6);
            text.setFixedSize(wrapWidth, null);
            return text;
        }

        function uiBanner(x, y, str) {
            const padX=20, padY=8;
            let style = {
                fontFamily: UI.type.family, fontSize:`${UI.type.small * 1.3}px`, color:'#053B35', fontStyle:'bold'
            };
            const text = GameState.game.add.text(x, y, str, sanitizeFontStyle(style)).setOrigin(0.5);
            const w = text.width + padX*2, h = text.height + padY*2;
            
            const bg = GameState.game.add.graphics({ x: x, y: y });
            bg.fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.banner).color, 1);
            bg.lineStyle(2, Phaser.Display.Color.HexStringToColor('#62D5C3').color, 1);
            bg.fillRoundedRect(-w / 2, -h / 2, w, h, 10);
            bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 10);
            bg.setDepth(5); text.setDepth(6);
            
            bg.setData('setSize', (newW, newH) => {
                bg.clear();
                bg.fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.banner).color, 1);
                bg.lineStyle(2, Phaser.Display.Color.HexStringToColor('#62D5C3').color, 1);
                bg.fillRoundedRect(-newW / 2, -newH / 2, newW, newH, 10);
                bg.strokeRoundedRect(-newW / 2, -newH / 2, newW, newH, 10);
            });
            return {bg, text};
        }

        function uiChoice(x, y, label, variant='ghost', onClick, width = UI.button.minW) {
            const w = width, h = UI.button.minH;
            const bgColor = (variant === 'primary') ? UI.color.primary : '#000000';
            const bgAlpha = (variant === 'primary') ? 1 : 0.1;
            const strokeWidth = UI.button.stroke;
            const strokeColorHex = (variant === 'primary') ? 0x000000 : Phaser.Display.Color.HexStringToColor(UI.color.outline).color;
            const strokeAlpha = (variant === 'primary') ? 0 : 1;
            const hoverColorHex = (variant === 'primary') ? 0x66aaff : 0x333333;
            const hoverAlpha = (variant === 'primary') ? 1 : 0.3;

            const rect = GameState.game.add.graphics({ x: x, y: y });
            rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
            rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
            rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
            rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
            rect.setDepth(5);
            
            const txt = GameState.game.add.text(x, y, label, {
                fontFamily: UI.type.family, fontSize:`${UI.button.font}px`,
                color: UI.color.text, fontStyle:'bold'
            }).setOrigin(0.5).setDepth(6);

            const zone = GameState.game.add.zone(x, y, w, h).setInteractive({useHandCursor:true}).setDepth(8);

            zone.on('pointerup', () => {
                   if (GameState.clickBlock) return;
                   log('Button', `Clicked: ${label}`);
                   GameState.game.tweens.add({
                       targets: [rect, txt], scaleX: 0.98, scaleY: 0.98, duration: 80,
                       ease: 'Power1', yoyo: true,
                       onComplete: () => { if (onClick) onClick(); }
                   });
                   GameState.clickBlock = true;
                   GameState.game.time.delayedCall(300, () => { GameState.clickBlock = false; });
               })
               .on('pointerover', () => {
                   rect.clear();
                   rect.fillStyle(hoverColorHex, hoverAlpha);
                   rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                   rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                   rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
               })
               .on('pointerout', () => {
                   rect.clear();
                   rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                   rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                   rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                   rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
               });

            const buttonObjects = {rect, txt, zone};
            buttonObjects.setSelected = (isSelected) => {
                if (isSelected) {
                    txt.setFill(UI.color.brand);
                    rect.clear();
                    rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                    rect.lineStyle(UI.button.stroke, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 1);
                    rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                    rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                } else {
                    txt.setFill(UI.color.text);
                    rect.clear();
                    rect.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, bgAlpha);
                    rect.lineStyle(strokeWidth, strokeColorHex, strokeAlpha);
                    rect.fillRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                    rect.strokeRoundedRect(-w / 2, -h / 2, w, h, UI.card.radius);
                }
            };
            return buttonObjects;
        }
        
        function uiButton(x, y, label, variant = 'secondary', onClick, width = UI.button.minW) {
            return uiChoice(x, y, label, variant, onClick, width);
        }

        function uiDraggable(x, y, label, id, width = UI.button.minW) {
            const h = UI.button.minH;
            const bgColor = 0x222222, bgAlpha = 0.5;
            const strokeColor = Phaser.Display.Color.HexStringToColor(UI.color.outline).color;
            const strokeAlpha = 1.0, strokeWidth = UI.button.stroke;
            
            const rect = GameState.game.add.graphics({ x: x, y: y });
            rect.fillStyle(bgColor, bgAlpha);
            rect.lineStyle(strokeWidth, strokeColor, strokeAlpha);
            rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.setDepth(5);

            const txt = GameState.game.add.text(x, y, label, {
                fontFamily: UI.type.family, fontSize:`${UI.button.font}px`,
                color: UI.color.text, fontStyle:'bold'
            }).setOrigin(0.5).setDepth(6);

            const zone = GameState.game.add.zone(x, y, width, h).setInteractive({ useHandCursor: true }).setDepth(8);
            GameState.game.input.setDraggable(zone);

            zone.on('dragstart', (pointer) => {
                GameState.dragLine.clear().lineStyle(4, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.7);
                GameState.dragSource = id;
                log('Drag', `Drag Start from ${id}`);
            });
            zone.on('drag', (pointer) => {
                const curve = new Phaser.Curves.CubicBezier(
                    new Phaser.Math.Vector2(x, y), new Phaser.Math.Vector2(x + 150, y),
                    new Phaser.Math.Vector2(pointer.x - 150, pointer.y), new Phaser.Math.Vector2(pointer.x, pointer.y)
                );
                GameState.dragLine.clear().lineStyle(4, Phaser.Display.Color.HexStringToColor(UI.color.brand).color, 0.7);
                curve.draw(GameState.dragLine);
            });
            zone.on('dragend', (pointer) => {
                GameState.dragLine.clear();
                GameState.dragSource = null;
                log('Drag', `Drag End`);
            });
            return { rect, txt, zone, id };
        }
        function uiDropTarget(x, y, label, id, width = UI.button.minW) {
            const h = UI.button.minH * 1.5;
            const bgColor = 0x222222, bgAlpha = 0.1;
            const strokeColor = Phaser.Display.Color.HexStringToColor(UI.color.textSoft).color;
            const strokeAlpha = 0.5, strokeWidth = UI.button.stroke;

            const rect = GameState.game.add.graphics({ x: x, y: y });
            rect.fillStyle(bgColor, bgAlpha);
            rect.lineStyle(strokeWidth, strokeColor, strokeAlpha);
            rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.setDepth(5);

            const txt = GameState.game.add.text(x, y, label, {
                fontFamily: UI.type.family, fontSize:`${UI.type.small}px`,
                color: UI.color.textSoft, fontStyle:'normal', align: 'center',
                wordWrap: { width: width - 20 }
            }).setOrigin(0.5).setDepth(6);

            const zone = GameState.game.add.zone(x, y, width, h).setDropZone().setDepth(8);
            const target = { rect, txt, zone, id, linked: false };

            zone.on('drop', (pointer) => {
                log('Drag', `Dropped on ${id} from ${GameState.dragSource}`);
                handleDragLink(GameState.dragSource, target);
                GameState.dragSource = null;
                GameState.dragLine.clear();
            });
            
            target.shake = () => {
                GameState.game.tweens.add({
                    targets: [rect, txt], x: x + 10, duration: 50,
                    ease: 'Power1', yoyo: true, repeat: 3,
                    onComplete: () => { rect.setPosition(x, y); txt.setPosition(x, y); }
                });
            };
            target.setSuccess = () => {
                target.linked = true;
                rect.clear();
                rect.fillStyle(bgColor, 0.3);
                rect.lineStyle(strokeWidth + 1, C_COLOR_GREEN, 1.0);
                rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
                rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
                txt.setFill(UI.color.text);
            };
            return target;
        }

        function uiLabel(x, y, str) {
            return GameState.game.add.text(x, y, str, {
                fontFamily: UI.type.family, fontSize:`${UI.type.small * 1.3}px`,
                color:UI.color.textSoft, align:'center'
            }).setOrigin(0.5).setDepth(6);
        }
        
        // --- HTML Button Handlers (FIX 3: Attached to window) ---
        window.startMission = function() {
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'none';
            if (GameState.game) {
                showNameInput();
            } else {
                console.error("Phaser game not ready or showNameInput not found.");
            }
        }
        window.showHelp = function() {
            if (GameState.game) {
                updateBanner("Instructions: Complete each stage by selecting the correct biological response.", false);
            } else {
                alert("Instructions: Complete each stage by selecting the correct biological response.");
            }
        }

        // --- Game Logic Functions (Standalone) ---
        
        function updateBanner(text, persist = false) {
            const scene = GameState.game;
            if (!scene || !scene.banner) return;
            if (scene.banner.hideTimer) {
                scene.banner.hideTimer.remove(false);
            }
            if (!text || text === "") {
                scene.banner.bg.setVisible(false);
                scene.banner.text.setVisible(false);
            } else {
                scene.banner.text.setText(text.toUpperCase());
                const padX=20, padY=8;
                const w = scene.banner.text.width + padX*2, h = scene.banner.text.height + padY*2;
                scene.banner.bg.getData('setSize')(w, h);
                scene.banner.bg.setVisible(true);
                scene.banner.text.setVisible(true);
                if (!persist) {
                    scene.banner.hideTimer = scene.time.delayedCall(3000, () => {
                        if (scene.banner.text.text === text.toUpperCase()) {
                            scene.banner.bg.setVisible(false);
                            scene.banner.text.setVisible(false);
                        }
                    });
                }
            }
        }
        
        function clearUILayer(isRelayout = false) {
           const scene = GameState.game;
           if (!scene || !scene.uiLayer) return;
           if (isRelayout) {
               const keep = new Set([scene.banner.bg, scene.banner.text]);
               for (const child of [...scene.uiLayer.list]) { 
                   if (child && !keep.has(child) && !child.destroyed && typeof child.destroy === 'function') {
                       child.destroy();
                   }
               }
           } else {
               scene.uiLayer.removeAll(true);
               scene.uiLayer.add([scene.banner.bg, scene.banner.text]);
           }
        }

        function clearGameplayLayer() {
            const scene = GameState.game;
            if (scene && scene.gameplayLayer) {
                 scene.gameplayLayer.removeAll(true);
            }
        }
        function clearBackgroundLayer() {
            const scene = GameState.game;
            if (scene && scene.backgroundLayer) {
                 scene.backgroundLayer.removeAll(true);
            }
        }

        function showTitleScreen(isRelayout = false) {
            log('Flow', 'showTitleScreen');
            if (!isRelayout) {
                GameState.scene = 'Title';
                GameState.stageComplete = false;
                clearGameplayLayer();
                clearBackgroundLayer();
            }
            clearUILayer(isRelayout);
            updateBanner("");
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'flex';
        }

        function showNameInput(isRelayout = false) {
            log('Flow', 'showNameInput');
            const scene = GameState.game;
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'none';

            if (!isRelayout) {
                GameState.scene = 'NameInput';
                GameState.studentName = "";
                GameState.stageComplete = false;
                clearGameplayLayer();
            }
            clearUILayer(isRelayout);
            updateBanner("FLIGHT SURGEON'S LOG: ENTER YOUR NAME", true);

            const namePrompt = uiText(scene.layout.midX, scene.layout.midY - 50, "SURGEON:", UI.type.h2, UI.color.brand);
            namePrompt.style.fontStyle = 'bold';
            const nameText = uiText(scene.layout.midX, scene.layout.midY, GameState.studentName.toUpperCase(), UI.type.h1, UI.color.text);
            nameText.setColor(UI.color.text);
            scene.cursor = scene.add.graphics()
                .fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.brand).color)
                .fillRect(0, -22, 3, 44);
            scene.cursor.x = nameText.x + nameText.width / 2 + 5;
            scene.cursor.y = nameText.y;
            scene.uiLayer.add([namePrompt, nameText, scene.cursor]);

            if (!isRelayout) {
                if(scene.input.keyboard) { scene.input.keyboard.off('keydown'); }
                scene.input.keyboard.on('keydown', (event) => {
                    if (GameState.scene !== 'NameInput') return;
                    if (event.keyCode === 8) {
                        GameState.studentName = GameState.studentName.slice(0, -1);
                    } else if (event.keyCode === 13 || event.keyCode === 32) {
                        if (GameState.studentName.length > 0 && event.keyCode === 32) { GameState.studentName += " "; }
                    } else if (event.keyCode >= 48 && event.keyCode <= 90 || event.keyCode >= 96 && event.keyCode <= 105) {
                        if (GameState.studentName.length < 20) { GameState.studentName += event.key; }
                    }
                    nameText.setText(GameState.studentName.toUpperCase());
                    scene.cursor.x = nameText.x - nameText.width / 2 + nameText.width + 5;
                });
            }
            const continueButton = uiButton(scene.layout.midX, scene.layout.midY + 150, "CONFIRM IDENTITY", 'primary', () => {
                if (GameState.studentName.length > 0) {
                    scene.input.keyboard.off('keydown'); 
                    GameState.worksheetData = [`MISSION LOG: FLIGHT SURGEON ${GameState.studentName.toUpperCase()}`];
                    showBriefing();
                } else {
                    updateBanner("IDENTITY REQUIRED. PLEASE ENTER YOUR NAME.", false);
                }
            }, 300);
            scene.uiLayer.add([continueButton.rect, continueButton.txt, continueButton.zone]);
        }

        function showBriefing(isRelayout = false) {
            log('Flow', 'showBriefing');
            const scene = GameState.game;
            if (!isRelayout) {
                GameState.scene = 'Briefing';
                GameState.stageComplete = false;
                clearGameplayLayer();
            }
            clearUILayer(isRelayout);
            updateBanner(`Welcome, Surgeon ${GameState.studentName.toUpperCase()}.`);
            const title = uiText(scene.layout.midX, scene.layout.midY - 150, "MISSION BRIEFING", UI.type.h1, UI.color.brand);
            title.style.fontStyle = 'bold';
            const body = uiText(scene.layout.midX, scene.layout.midY - 10, 
                "Alfi has been bitten by an unknown alien specimen on planet XYLOS-4.\n\n" +
                "His vital signs show a rapid local inflammatory response. We're detecting unknown... PAMPs.\n\n" +
                "Your mission is to manage the acute inflammation pathway. Identify each step and deploy the correct biological response. Your actions will be recorded in the mission log.", 
                UI.type.body, UI.color.textSoft);
            const startButton = uiButton(scene.layout.midX, scene.layout.midY + 160, "START PROCEDURE", 'primary', () => {
                showGameplay(0);
            }, 300);
            scene.uiLayer.add([title, body, startButton.rect, startButton.txt, startButton.zone]);
        }

        function showGameplay(stage, isRelayout = false) {
            log('Flow', `showGameplay stage ${stage}`);
            if (!isRelayout) {
                GameState.scene = 'Gameplay';
                GameState.currentStage = stage;
                GameState.stageComplete = false; 
            }
            clearUILayer(isRelayout);
            if (!isRelayout) { clearGameplayLayer(); }
            switch (stage) {
                case 0: runStage0_Recognition(isRelayout); break;

        function uiDropTarget(x, y, label, id, width = UI.button.minW) {
            const h = UI.button.minH * 1.5;
            const bgColor = 0x222222, bgAlpha = 0.1;
            const strokeColor = Phaser.Display.Color.HexStringToColor(UI.color.textSoft).color;
            const strokeAlpha = 0.5, strokeWidth = UI.button.stroke;

            const rect = GameState.game.add.graphics({ x: x, y: y });
            rect.fillStyle(bgColor, bgAlpha);
            rect.lineStyle(strokeWidth, strokeColor, strokeAlpha);
            rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
            rect.setDepth(5);

            const txt = GameState.game.add.text(x, y, label, {
                fontFamily: UI.type.family, fontSize:`${UI.type.small}px`,
                color: UI.color.textSoft, fontStyle:'normal', align: 'center',
                wordWrap: { width: width - 20 }
            }).setOrigin(0.5).setDepth(6);

            const zone = GameState.game.add.zone(x, y, width, h).setDropZone().setDepth(8);
            const target = { rect, txt, zone, id, linked: false };

            zone.on('drop', (pointer) => {
                log('Drag', `Dropped on ${id} from ${GameState.dragSource}`);
                handleDragLink(GameState.dragSource, target);
                GameState.dragSource = null;
                GameState.dragLine.clear();
            });
            
            target.shake = () => {
                GameState.game.tweens.add({
                    targets: [rect, txt], x: x + 10, duration: 50,
                    ease: 'Power1', yoyo: true, repeat: 3,
                    onComplete: () => { rect.setPosition(x, y); txt.setPosition(x, y); }
                });
            };
            target.setSuccess = () => {
                target.linked = true;
                rect.clear();
                rect.fillStyle(bgColor, 0.3);
                rect.lineStyle(strokeWidth + 1, C_COLOR_GREEN, 1.0);
                rect.fillRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
                rect.strokeRoundedRect(-width / 2, -h / 2, width, h, UI.card.radius);
                txt.setFill(UI.color.text);
            };
            return target;
        }

        // --- Game Logic Functions (Standalone) ---
        
        function updateBanner(text, persist = false) {
            const scene = GameState.game;
            if (!scene || !scene.banner) return;
            if (scene.banner.hideTimer) {
                scene.banner.hideTimer.remove(false);
            }
            if (!text || text === "") {
                scene.banner.bg.setVisible(false);
                scene.banner.text.setVisible(false);
            } else {
                scene.banner.text.setText(text.toUpperCase());
                const padX=20, padY=8;
                const w = scene.banner.text.width + padX*2, h = scene.banner.text.height + padY*2;
                scene.banner.bg.getData('setSize')(w, h);
                scene.banner.bg.setVisible(true);
                scene.banner.text.setVisible(true);
                if (!persist) {
                    scene.banner.hideTimer = scene.time.delayedCall(3000, () => {
                        if (scene.banner.text.text === text.toUpperCase()) {
                            scene.banner.bg.setVisible(false);
                            scene.banner.text.setVisible(false);
                        }
                    });
                }
            }
        }
        
        function clearUILayer(isRelayout = false) {
           const scene = GameState.game;
           if (!scene || !scene.uiLayer) return;
           if (isRelayout) {
               const keep = new Set([scene.banner.bg, scene.banner.text]);
               for (const child of [...scene.uiLayer.list]) { 
                   if (child && !keep.has(child) && !child.destroyed && typeof child.destroy === 'function') {
                       child.destroy();
                   }
               }
           } else {
               scene.uiLayer.removeAll(true);
               scene.uiLayer.add([scene.banner.bg, scene.banner.text]);
           }
        }

        function clearGameplayLayer() {
            const scene = GameState.game;
            if (scene && scene.gameplayLayer) {
                 scene.gameplayLayer.removeAll(true);
            }
        }
        function clearBackgroundLayer() {
            const scene = GameState.game;
            if (scene && scene.backgroundLayer) {
                 scene.backgroundLayer.removeAll(true);
            }
        }

        function showTitleScreen(isRelayout = false) {
            log('Flow', 'showTitleScreen');
            if (!isRelayout) {
                GameState.scene = 'Title';
                GameState.stageComplete = false;
                clearGameplayLayer();
                clearBackgroundLayer();
            }
            clearUILayer(isRelayout);
            updateBanner("");
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'flex';
        }

        function showNameInput(isRelayout = false) {
            log('Flow', 'showNameInput');
            const scene = GameState.game;
            const overlay = document.getElementById('hero-overlay');
            if (overlay) overlay.style.display = 'none';

            if (!isRelayout) {
                GameState.scene = 'NameInput';
                GameState.studentName = "";
                GameState.stageComplete = false;
                clearGameplayLayer();
            }
            clearUILayer(isRelayout);
            updateBanner("FLIGHT SURGEON'S LOG: ENTER YOUR NAME", true);

            const namePrompt = uiText(scene.layout.midX, scene.layout.midY - 50, "SURGEON:", UI.type.h2, UI.color.brand);
            namePrompt.style.fontStyle = 'bold';
            const nameText = uiText(scene.layout.midX, scene.layout.midY, GameState.studentName.toUpperCase(), UI.type.h1, UI.color.text);
            nameText.setColor(UI.color.text);
            scene.cursor = scene.add.graphics()
                .fillStyle(Phaser.Display.Color.HexStringToColor(UI.color.brand).color)
                .fillRect(0, -22, 3, 44);
            scene.cursor.x = nameText.x + nameText.width / 2 + 5;
            scene.cursor.y = nameText.y;
            scene.uiLayer.add([namePrompt, nameText, scene.cursor]);

            if (!isRelayout) {
                if(scene.input.keyboard) { scene.input.keyboard.off('keydown'); }
                scene.input.keyboard.on('keydown', (event) => {
                    if (GameState.scene !== 'NameInput') return;
                    if (event.keyCode === 8) {
                        GameState.studentName = GameState.studentName.slice(0, -1);
                    } else if (event.keyCode === 13 || event.keyCode === 32) {
                        if (GameState.studentName.length > 0 && event.keyCode === 32) { GameState.studentName += " "; }
                    } else if (event.keyCode >= 48 && event.keyCode <= 90 || event.keyCode >= 96 && event.keyCode <= 105) {
                        if (GameState.studentName.length < 20) { GameState.studentName += event.key; }
                    }
                    nameText.setText(GameState.studentName.toUpperCase());
                    scene.cursor.x = nameText.x - nameText.width / 2 + nameText.width + 5;
                });
            }
            const continueButton = uiButton(scene.layout.midX, scene.layout.midY + 150, "CONFIRM IDENTITY", 'primary', () => {
                if (GameState.studentName.length > 0) {
                    scene.input.keyboard.off('keydown'); 
                    GameState.worksheetData = [`MISSION LOG: FLIGHT SURGEON ${GameState.studentName.toUpperCase()}`];
                    showBriefing();
                } else {
                    updateBanner("IDENTITY REQUIRED. PLEASE ENTER YOUR NAME.", false);
                }
            }, 300);
            scene.uiLayer.add([continueButton.rect, continueButton.txt, continueButton.zone]);
        }
